set-option -sa terminal-overrides ',xterm*:Tc'
set -g default-terminal 'tmux-256color'

# Set the prefix to CTRL+Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Set mouse mode on
set -g mouse on

# Start windows and panes at 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

bind r source-file ~/.config/tmux/tmux.conf \; display "Tmux config reloaded!"

# shortcuts
bind k kill-session
bind q kill-server

# Open windows and panes in current directory
bind c new-window -c "#{pane_current_path}"
bind | split-window -v -c "#{pane_current_path}"
bind - split-window -h -c "#{pane_current_path}"

# Resurrect and continuum
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-boot 'on'
set -g @continuum-restore 'on'
set -g @continuum-boot-options 'iterm,fullscreen'

# Catppuccin theme
set -g @catppuccin_gitmux_text "#(gitmux -cfg $HOME/.config/tmux/gitmux.conf \"#{pane_current_path}\")"
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_icon_enable "yes"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_status_justify "centre"
set -g @catppuccin_status_modules_right "gitmux"
set -g @catppuccin_status_modules_left "session"

set -g @catppuccin_session_icon ""
set -g @catppuccin_gitmux_icon ""

# Set vi mode
set-window-option -g mode-keys vi
# Keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-battery'

run '~/.tmux/plugins/tpm/tpm'
