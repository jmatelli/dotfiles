# Add these lines to ~/.tmux.conf
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',xterm*:sitm=\E[3m'
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Pass modified keys (e.g. shift+enter, ctrl+enter, ctrl+tab) through to apps like opencode.
# "always", not "on": opencode requests them via the kitty keyboard protocol,
# which tmux ignores, so with "on" it would only ever get a plain Tab/Enter.
set -s extended-keys always
# tmux decodes ctrl+shift+tab (CSI 9;6u from kitty) as C-BTab and then sends the
# pane a plain back-tab, dropping ctrl. Re-send the real CSI-u code instead.
bind -n C-BTab send-keys -l "\033[9;6u"
# Same for ctrl+shift+t, which tmux would otherwise turn into plain ctrl+t.
bind -n C-S-t send-keys -l "\033[116;6u"
set -s extended-keys-format csi-u
set -as terminal-features ',xterm*:extkeys'

# native config
set -g base-index 1 # start windows numbering at 1
setw -g pane-base-index 1
set -g mouse on        #For tmux version 2.1 and up
set -g history-limit 10000 # increase scrollback buffer size

# Enable kitty graphics protocol in tmux
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Plugins conf
set -g @continuum-boot 'on'
set -g @continuum-boot-options 'kitty'
set -g @continuum-restore 'on'

set -g @resurrect-strategy-nvim 'session'

bind-key r source-file ~/.config/tmux/tmux.conf \; display-message " ✅ Config reloaded"

bind-key '\' split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind-key c new-window -c "#{pane_current_path}"

bind-key x kill-pane
bind-key & kill-window
bind-key k kill-session
bind-key q kill-server

# swap window with the one on the left
bind-key h swap-window -d -t -1
# swap window with the one on the right
bind-key l swap-window -d -t +1

# Resurrect
set -g @resurrect-processes '"~yarn dev->yarn dev'
set -g @resurrect-processes '"~yarn tsc->yarn tsc'
set -g @resurrect-processes '"~lg->lg'
set -g @resurrect-processes '"~make livereload->make livereload'
set -g @resurrect-processes '"~stripe listen->stripe listen *'
set -g @resurrect-processes '"~ngrok http->ngrok http *'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'rickstaa/tmux-notify'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Neon Tokyo Night look, matching the zsh prompt and Herdr. Sourced before
# tpm so tmux-continuum can still hook its autosave into status-right.
source-file ~/.config/tmux/tokyo-neon.tmux

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
