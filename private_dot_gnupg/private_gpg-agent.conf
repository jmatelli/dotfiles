# How long gpg-agent keeps a passphrase after you type it. While it's
# cached, any process of yours can decrypt without asking: pass show, and so
# agent shells too. GnuPG's defaults are 10 min after last use, 2 h at most.
# Shorter here: 5 min after last use, 1 h at most, then it asks again.
default-cache-ttl 300
max-cache-ttl 3600
