# Checks on every push to main and every PR:
# - secrets: gitleaks over the whole history (the local pre-commit hook misses
#   --no-verify, edits on github.com, and machines without gitleaks);
# - chezmoi: every file rendered on Linux and macOS (a dry run, nothing
#   written), so a template typo fails here and not on a new machine;
# - shellcheck: the scripts, and the script templates as rendered per OS;
# - agent allowlists: the read-only agents' shell rules (Claude Code hook
#   and OpenCode permissions) against tests/agent-allowlist/cases.tsv;
# - workflows: actionlint and zizmor over .github, so these files and
#   Dependabot's bumps stay valid and safe.
name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $tarball\$" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - name: Scan the whole history
        run: gitleaks git --redact --no-banner --verbose

  agent-allowlists:
    # macOS too: there the hook runs under /bin/bash 3.2.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Shell allowlists of the read-only agents
        run: python3 tests/agent-allowlist/run.py

  workflows:
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: 1.7.12
      ZIZMOR_VERSION: 1.32.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint (checksum verified) and zizmor
        run: |
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSL "$base/actionlint_${ACTIONLINT_VERSION}_checksums.txt" | grep " $tarball\$" | sha256sum -c -
          tar -xzf "$tarball" actionlint
          sudo install actionlint /usr/local/bin/actionlint
          pipx install "zizmor==${ZIZMOR_VERSION}"
      - name: actionlint
        run: actionlint
      # Offline: no token. That skips the audits that look the pinned SHAs up
      # on GitHub (impostor-commit, ref-version-mismatch,
      # known-vulnerable-actions); Dependabot picks the pins from releases.
      - name: zizmor
        run: zizmor --offline --no-progress --render-links never .github

  chezmoi:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CHEZMOI_VERSION: 2.72.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The smoke test answers every install question
        run: |
          # docker-smoke-test.sh pre-fills the answers to .chezmoi.toml.tmpl's
          # questions; a question it misses hangs the headless install.
          asked=$(grep -o 'promptStringOnce \. "[A-Za-z]*"' .chezmoi.toml.tmpl | cut -d'"' -f2 | sort)
          seeded=$(sed -n '/^SEED_CONFIG_CMD=/,/^EOF/p' docker-smoke-test.sh | grep -oE '^ +[A-Za-z]+ =' | tr -d ' =' | sort)
          if [ "$asked" != "$seeded" ]; then
            echo "Install questions: ${asked//$'\n'/ }"
            echo "Smoke test answers: ${seeded//$'\n'/ }"
            echo "::error file=docker-smoke-test.sh::SEED_CONFIG_CMD must answer every promptStringOnce in .chezmoi.toml.tmpl"
            exit 1
          fi

      - name: Install chezmoi
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin" -t "v${CHEZMOI_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Render every file (dry run)
        run: |
          # .chezmoi.toml.tmpl puts the source in ~/.dotfiles; answer its
          # questions up front (it can't prompt here), one placeholder each.
          ln -s "$GITHUB_WORKSPACE" "$HOME/.dotfiles"
          mkdir -p "$HOME/.config/chezmoi"
          {
            echo "[data]"
            grep -o 'promptStringOnce \. "[A-Za-z]*"' .chezmoi.toml.tmpl | cut -d'"' -f2 | while read -r key; do
              if [ "$key" = projectsDir ]; then echo "    $key = \"~/Projects\""; else echo "    $key = \"ci-$key\""; fi
            done
          } > "$HOME/.config/chezmoi/chezmoi.toml"
          chezmoi init --source "$HOME/.dotfiles" --no-tty
          chezmoi apply --dry-run --force --no-tty
          echo "Rendered $(chezmoi managed | wc -l | tr -d ' ') files."

      - name: Install shellcheck
        if: runner.os == 'macOS'
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install -q shellcheck

      - name: shellcheck
        run: |
          status=0
          # Plain shell scripts (sh/bash shebang only).
          for f in install.sh setup-secrets.sh docker-smoke-test.sh dot_local/bin/* .chezmoiscripts/*.sh; do
            head -1 "$f" | grep -qE '^#!.*\b(ba)?sh\b' || continue
            shellcheck -S warning "$f" || status=1
          done
          # Script templates, as chezmoi renders them on this OS.
          for t in .chezmoiscripts/*.sh.tmpl; do
            chezmoi execute-template < "$t" > "$RUNNER_TEMP/rendered.sh"
            shellcheck -S warning -s bash "$RUNNER_TEMP/rendered.sh" || { echo "::error file=$t::shellcheck failed on the rendered script"; status=1; }
          done
          exit $status
